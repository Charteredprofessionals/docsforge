[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
norecursedirs = ["src-tauri/target", ".git", "node_modules"]
collect_ignore = ["test_log.txt", "test_log_final.txt"]
