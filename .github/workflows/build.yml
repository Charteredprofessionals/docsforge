name: Build DocForge

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'projects/docsforge/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: projects/docsforge
        run: npm ci

      - name: Build frontend
        working-directory: projects/docsforge
        run: npm run build

      - name: Build CLI + On-Prem engines (v2.0.0 feature binaries)
        working-directory: projects/docsforge/src-tauri
        run: cargo build --release --features cli --features onprem

      # Always provide a code-signing certificate for the Windows bundles.
      # - If repo secrets WINDOWS_CERTIFICATE (base64 PFX) + WINDOWS_CERTIFICATE_PASSWORD
      #   are set, they are used (production / trusted signing).
      # - Otherwise a self-signed cert is generated so the MSIX — which Windows REQUIRES to be
      #   signed — still builds in CI for testing. Self-signed packages are only installable on
      #   machines that trust the generated cert.
      # Tauri reads WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD to sign msi/nsis/msix.
      - name: Prepare code-signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_SECRET: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certDir = "certificate"
          New-Item -ItemType Directory -Path $certDir -Force | Out-Null
          if ($env:WINDOWS_CERTIFICATE_SECRET) {
            Write-Host "Using provided WINDOWS_CERTIFICATE secret"
            Set-Content -Path "$certDir/tempCert.txt" -Value $env:WINDOWS_CERTIFICATE_SECRET
            certutil -decode "$certDir/tempCert.txt" "$certDir/certificate.pfx" | Out-Null
            Remove-Item -Path "$certDir/tempCert.txt"
            Import-PfxCertificate -FilePath "$certDir/certificate.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD_SECRET -Force -AsPlainText) | Out-Null
            Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE=$env:WINDOWS_CERTIFICATE_SECRET"
            Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD_SECRET"
          } else {
            Write-Host "No WINDOWS_CERTIFICATE secret - generating self-signed cert for CI (dev/test builds)"
            $password = ConvertTo-SecureString -String "DocForgeCI" -Force -AsPlainText
            $cert = New-SelfSignedCertificate -Type Custom -KeyUsage DigitalSignature `
              -Subject "CN=DocForge" `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
              -FriendlyName "DocForge CI Dev Cert"
            $pfx = "$certDir/certificate.pfx"
            Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
            Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE=$b64"
            Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_PASSWORD=DocForgeCI"
          }

      # `tauri build` (not plain cargo build) embeds the frontend dist/ into docforge.exe and
      # produces the MSI, NSIS and MSIX bundles. MSIX REQUIRES a signature (provided above).
      - name: Build GUI app + Windows bundles (msi, nsis, msix)
        working-directory: projects/docsforge
        run: npm run build:tauri -- --bundles msi,nsis,msix

      - name: Build Inno Setup installer (from the embedded docforge.exe)
        run: |
          $iss = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iss)) {
            $iss = "C:\Users\$env:USERNAME\AppData\Local\Programs\Inno Setup 6\ISCC.exe"
          }
          & $iss "projects/docsforge/installer.iss"

      - name: Upload Inno Setup installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-InnoSetup
          path: projects/docsforge/exports/windows/DocForge_*_x64-setup.exe
          retention-days: 30

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-MSI
          path: projects/docsforge/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-NSIS
          path: projects/docsforge/src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 30

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-MSIX
          path: projects/docsforge/src-tauri/target/release/bundle/msix/*.msix
          retention-days: 30

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-Binary
          path: projects/docsforge/src-tauri/target/release/docforge.exe
          retention-days: 30

      - name: Upload CLI engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-CLI
          path: projects/docsforge/src-tauri/target/release/docforge-cli.exe
          retention-days: 30

      - name: Upload On-Prem engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocForge-OnPrem
          path: projects/docsforge/src-tauri/target/release/docforge-onprem.exe
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            projects/docsforge/exports/windows/DocForge_*_x64-setup.exe
            projects/docsforge/src-tauri/target/release/bundle/msi/*.msi
            projects/docsforge/src-tauri/target/release/bundle/nsis/*-setup.exe
            projects/docsforge/src-tauri/target/release/bundle/msix/*.msix
            projects/docsforge/src-tauri/target/release/docforge-cli.exe
            projects/docsforge/src-tauri/target/release/docforge-onprem.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
