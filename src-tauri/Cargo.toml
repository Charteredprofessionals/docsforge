[package]
name = "docforge"
version = "2.0.0"
edition = "2021"

# The desktop GUI app (src/main.rs) is the default binary built by `tauri build`.
# The CLI and on-prem engines are opt-in targets gated behind features so the
# Tauri bundler never mistakes them for the main application binary.
[features]
default = []
cli = []
onprem = []

[[bin]]
name = "docforge-cli"
path = "src/tools/docforge_cli.rs"
required-features = ["cli"]

[[bin]]
name = "docforge-onprem"
path = "src/tools/docforge_onprem.rs"
required-features = ["onprem"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
quick-xml = "0.37"
sha2 = "0.10"
hmac = "0.12"
rsa = { version = "0.9", features = ["pem"] }
pem-rfc7468 = "1"
chrono = "0.4"
csv = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# Native PDF export (no LibreOffice dependency) — adopted from templatebuilder
printpdf = "0.7"
docx-rs = "0.4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase", "minwindef"] }

[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization (smaller, faster binaries)
codegen-units = 1   # better optimization, single codegen unit
panic = "abort"     # smaller binary, no unwinding tables
strip = true        # strip symbols for release binaries
